spring:
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.30.82.120:9092,172.30.82.121:9092,172.30.82.122:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:sls-telegram-alert-v1}
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        max.poll.records: 1
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:900000}
    listener:
      ack-mode: manual_immediate
      concurrency: 1
alert:
  topic: ${KAFKA_TOPIC:sls-mining-window-fixed}
  risk-mode: ${RISK_MODE:score}
  min-score: ${MIN_SCORE:70}
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:${alert.bot-token:8838049445:AAGI9j03bw_q_UWPYTPEau3YQ8q7G56OZWs}}
  chat-id: ${TELEGRAM_CHAT_ID:${alert.chat-id:-5314397885}}
  api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
  connect-timeout: ${TELEGRAM_CONNECT_TIMEOUT:10s}
  request-timeout: ${TELEGRAM_REQUEST_TIMEOUT:20s}
