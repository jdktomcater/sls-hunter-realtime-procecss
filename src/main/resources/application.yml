spring:
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:sls-telegram-alert-v1}
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        max.poll.records: 1
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:900000}
    listener:
      ack-mode: manual_immediate
      concurrency: 1
alert:
  topic: ${KAFKA_TOPIC:sls-mining-window-fixed}
  risk-mode: ${RISK_MODE:score}
  min-score: ${MIN_SCORE:70}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
